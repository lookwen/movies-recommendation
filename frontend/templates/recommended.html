<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>Document</title>
</head>
<body>
    <div class="nav">
        <div class="sections-wrap">
            <a class="section-button" href="{{ url_for('base') }}">Wszystkie filmy</a>
            <a class="section-button" href="{{ url_for('get_recommended') }}">Polecane filmy</a>
            <a class="section-button" href="{{ url_for('get_my_raitings') }}">Moje oceny</a>
        </div>

        <div class="logging-wrap">
            {% if session.get('loggedin') %}
                <div class="user-panel"> 
                    <a href="#" class="user-avatar"> {{ session['username'][0].upper() }} </a> 
                    <span class="username"> {{ session['username'] }} </span>
                </div>
            {% else %}
                <p>ERROR</p>
            {% endif %}
        </div>
        
    </div>

    <div class="content">
        <div class="ratings-wrapper">
            {{ ratings }}
            <div class="movies-title">Najlepsze filmy</div>
            <div class="best-movies">
            

            </div>
            <div class="movies-title">Filmy dla ciebie</div>
            <div class="for-you-movies">
                
            </div>



        </div>

    <script type="module" src="{{ url_for('static', filename='js/recommend.js') }}"></script>

</body>
</html>
